<app-header></app-header>
<div class="container py-5">
  <div class="row gx-5">
    <!-- Columna de Imagen -->
    <div class="col-lg-6 mb-4">
      <div class="bg-image rounded h-100" style="max-height: 460px">
        <img
          src="https://i.imgur.com/kEbNc66.jpeg"
          class="img-fluid object-fit-cover h-100 w-100"
          alt="Producto"
        />
        <div class="hover-overlay">
          <div
            class="mask"
            style="background-color: rgba(251, 251, 251, 0.2)"
          ></div>
        </div>
      </div>
    </div>
    <!-- Columna de Información -->
    <div class="col-lg-6">
      <h2 class="fw-bold mb-3">Conjunto Deportivo Premium</h2>
      <!-- Precio -->
      <div class="mb-4">
        <span class="text-danger h3 fw-bold">$59.99</span>
      </div>
       <!-- Categoría y Género -->
       <div class="row mb-4">
        <div class="col-md-6">
          <p class="mb-2"><strong>Categoría:</strong> Ropa Deportiva</p>
        </div>
        <div class="col-md-6">
          <p class="mb-2"><strong>Género:</strong> Unisex</p>
        </div>
      </div>
      <!-- Estado -->
      <p class="mb-4">
        <strong>Estado:</strong>
        <span class="badge bg-success">Disponible</span>
      </p>
      <!-- Tallas -->
      <div class="mb-4">
        <h6 class="fw-bold">Tallas:</h6>
        <div class="d-flex flex-wrap">
          <button class="btn btn-outline-dark me-2 mb-2">
            S
          </button>
        </div>
      </div>
      <!-- Botones de Acción -->
      <div class="d-flex flex-wrap gap-3 mb-4">
        <button class="btn btn-primary flex-grow-1 py-2">
          <i class="far fa-credit-card me-2"></i>Comprar
        </button>
        <button class="btn btn-danger flex-grow-1 py-2">
          <i class="fas fa-ban me-2"></i>Cancelar
        </button>
      </div>
    </div>
  </div>
</div>
