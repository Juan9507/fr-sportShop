<!-- Navbar-->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <!-- Brand/Logo -->
    <a class="navbar-brand me-2 mb-1 d-flex align-items-center" href="#">
      <img
        src="assets/productosimagenes/logo.png"
        height="20"
        alt=""
        loading="lazy"
        style="margin-top: 2px"
      />
    </a>

    <!-- Toggle button for mobile -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="basicNavbar.toggle()"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <i class="fas fa-bars"></i>
    </button>

    <!-- Right elements - Always visible -->
    <div class="d-flex order-lg-2 ms-auto">
      <ul class="navbar-nav flex-row">
        <li class="nav-item dropdown me-3 me-lg-1">
          <a
            class="nav-link dropdown-toggle hidden-arrow"
            href="/compras"
            id="navbarDropdownMenuLink"
            aria-expanded="false"
            mdbTooltip="Mis compras"
          >
            <i class="fas fa-shopping-basket"></i>
          </a>
        </li>
        <app-notificacion></app-notificacion>
        <li mdbDropdown class="nav-item dropdown me-3 me-lg-1">
          <button
            class="nav-link d-sm-flex align-items-sm-center"
            href="#"
            id="navbarDropdownMenuLink"
            mdbDropdownToggle
            aria-expanded="false"
            role="button"
          >
            <img
              src="https://mdbootstrap.com/img/new/avatars/1.webp"
              class="rounded-circle"
              height="22"
              alt=""
              loading="lazy"
            />
            <strong class="d-none d-sm-block ms-1" *ngIf="usuarioLogueado">
              {{ usuarioRepuesta?.datos?.nombre }}
            </strong>
            <strong class="d-none d-sm-block ms-1" *ngIf="!usuarioLogueado">
              Menú usuario
            </strong>
          </button>
          <ul
            mdbDropdownMenu
            class="dropdown-menu dropdown-menu-end"
            aria-labelledby="navbarDropdownMenuLink"
          >
            <li *ngIf="!usuarioLogueado">
              <button class="dropdown-item" (click)="openModal()">Iniciar sesión</button>
            </li>
            <li *ngIf="!usuarioLogueado">
              <a class="dropdown-item" href="/registro">Registrarme</a>
            </li>
            <li *ngIf="usuarioLogueado">
              <button
                class="dropdown-item"
                (click)="cerrarSesion()"
                >Cerrar sesión
              </button>
            </li>
            <li *ngIf="usuarioLogueado">
              <a class="dropdown-item" href="#">Mi perfil</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>

    <!-- Collapsible content - Navigation links -->
    <div
      class="collapse navbar-collapse order-lg-1"
      id="navbarSupportedContent"
      mdbCollapse
      #basicNavbar="mdbCollapse"
    >
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/inicio">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/productos">Productos</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
